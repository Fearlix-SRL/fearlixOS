# image will be published to ghcr.io/<user>/<name>
name: fearlixos-cosmic
# description will be included in the image's metadata
description: Fedora Silverblue Cosmic by Fearlix SRL

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    group-install:
      with-optional: false
      packages:
        - cosmic-desktop-environment
    install:
      packages:
        # cosmic
        - NetworkManager-tui
        - NetworkManager-openvpn
        # utils
        - starship
        - btrfs-assistant
        - neovim
        - alacritty
        - vorta
        - kde-connect
        # virtualization
        - virt-install
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - virt-manager
        - virt-viewer
        - libguestfs-tools
        - python3-libguestfs
        - podman-compose

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraMono

  - type: yafti

  - type: systemd
    system:
      enabled:
        - cosmic-greeter.service
      disabled:
        - gdm.service
    user:
      disabled:
        - livepaper.service

  - type: script
    scripts:
      - livepaper.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
